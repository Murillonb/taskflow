<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="./img/favicon/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Birthstone&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header container">
    <h1 class="logotipo">Task Flow</h1>
    <p class="font-text">Controle cada task da sua vida!</p>
  </header>

  <main class="container">

    <section class="score ">
      <div class="score-active box"><span class="cor-p5 font-information">0</span>Active</div>
      <div class="score-done box"><span class="cor-p4 font-information">0</span>Done</div>
      <div class="score-total box"><span class="cor-p3 font-information">0</span>Total</div>
    </section>

    <form class="form box">
      <input type="text" name="task" id="task" placeholder="write the new task...">
      <button class="btn">+ Adicionar</button>
    </form>

    <section class="task container">
      <form class="box">
        <div>
          <label class="font-task">
            <input type="checkbox" name="status" id="status">
            <span>Teste</span>
          </label>
        </div>
        <div>
          <span class="date">09 de fev.</span>
          <button class="btn">Excluir</button>
        </div>
      </form>
    </section>

  </main>

  <script src="./js/script.js"></script>
</body>

</html>
